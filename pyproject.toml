[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-learning-hank"
version = "0.0.0"
description = "Deep Learning + HANK / NSR-HANK research platform (Tier-0 kernel; DLH-2A fixed-price validation subgate). Engineering implementation only; no accepted calibration or Results."
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
