  "TIER_2_low_dimensional_structural_mobility",
  "TIER_3_source_specific_measurement_wedges",
  "TIER_4_production_and_productivity_residuals",
  "TIER_5_government_residual_only_if_separately_anchored_and_bounded",
]
rules = [
  "RB1 every free residual block has a non-empty declared moment set",
  "RB2 the declared free-parameter count of a block may not exceed its assigned moment count",
  "RB3 tier-1 accounting identities are imposed exactly; no residual parameter may enter them",
  "RB4 moment sets are disjoint across residual blocks",
  "RB5 no two residual blocks may be algebraic complements inside one identity, and no block may be defined as the difference of two others in a way no moment can separate",
  "RB6 the government block is active only with its own anchor or prior, a moment set disjoint from every labor wedge, and a dimension bounded by its declared form",
  "RB7 the six-element forbidden set is not simultaneously unrestricted; at least the tier-3 wedges satisfy RB1-RB2 and at least one tier-4 or tier-5 block is anchored or inactive",
  "RB8 the design reports the dimension-accounting table D9, the moment-assignment matrix and the absorption shares D7; a missing report blocks interpretation claims",
]
failure_status = "RESIDUAL_BUDGET_EXCEEDED__NOT_ADMISSIBLE"
failure_is_fail_closed = true
no_double_residual_rule_id = "NO_DOUBLE_RESIDUAL_RULE"
no_double_residual_rule = "the same unexplained variation may not be absorbed by two residual blocks; a labor-wedge moment may not also be assigned to the TFP or government block; the government block may not be an unbounded provincial balancing residual; a residual introduced only because an identity fails to close is forbidden"
permitted_responses_to_a_budget_failure = [
  "resolve the missing source or anchor under Issue 83",
  "reduce dimensionality by a declared prior or grouping",
  "drop the affected regions or periods by the declared exclusion rule",
]
freeing_a_wedge_to_compensate = "FORBIDDEN"

