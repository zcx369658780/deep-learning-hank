  "L_time: wedge_i,t = wedge_bar_t",
  "L_factor: log wedge_i,t = log wedge_bar_t + gamma' X_i",
  "L_anchored: pinned by a declared anchor where covered, declared form elsewhere",
  "L_grouped: wedge_i,t = wedge_g(i) with a declared partition g(i)",
]
chosen_before_execution = true
free_parameter_count_reported_in = "D9"
form_change_after_outcomes_observed = "FORBIDDEN"
