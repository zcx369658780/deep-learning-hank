model_calls = 0
training_calls = 0
empirical_bridge_calls = 0
permitted_check_classes = [
  "symbolic_reasoning",
  "static_reasoning",
  "config_parse",
  "cross_document_consistency",
  "dimension_and_unit_check",
]

[latent_objects.W_star_ij_t]
symbol = "W_star_ij,t"
name = "latent conditional destination share of labor services"
interpretation = "share of the labor-service outflow of origin i realized in period t that goes to j, conditional on the outflow having occurred"
unit = "dimensionless_share"
kind = "v1_learning_object"
block_membership = ["household_block_as_given_input", "flow_accounting_block", "measurement_block"]
normalization = "W_star_ii = 0 ; W_star_ij >= 0 ; sum over j != i of W_star_ij = 1"
identification_status = "STRUCTURALLY_DEFINED_NOT_OBSERVED"
observed_by_any_source = false
may_be_equated_to_an_observation = false
never_a_feature = false
never_a_label = false

[latent_objects.m_star_i_t]
symbol = "m_star_i,t"
name = "latent outflow share / transition intensity"
interpretation = "within-period outflow share of the origin labor amount, required by the accounting closure"
unit = "dimensionless_share_in_0_1"
kind = "given_accounting_input"
block_membership = ["household_block_as_given_input", "flow_accounting_block", "measurement_block"]
identification_status = "LATENT__BLOCKED_BY_H"
admissible_derivation_routes = ["M-A_annual_transition_given_input", "M-B_not_identified", "M-C_not_identified", "M-D_prohibited"]
observed_by_any_source = false
may_be_equated_to_an_observation = false
never_a_feature = true
never_a_label = true
required_declarations = ["m_provenance_id", "m_unit_basis", "m_time_alignment", "accounting_period_alignment", "m_is_never_a_feature", "m_not_learning_target"]

[latent_objects.ell_star_i_t]
symbol = "ell_star_i,t"
name = "latent effective origin labor amount"
interpretation = "total effective labor of origin i in period t entering the flow identity"
unit = "efficiency_labor_units"
kind = "given_accounting_input"
block_membership = ["household_block_as_given_input", "firm_block_as_effective_labor", "flow_accounting_block", "measurement_block"]
decomposition = "ell_star_i,t = N_workers_star_i,t * h_star_i,t * e_star_i,t"
identification_status = "LATENT__BLOCKED_BY_H"
observed_by_any_source = false
may_be_equated_to_an_observation = false
may_be_equated_to_a_person_count = false
never_a_feature = true
never_a_label = true
decomposition_is_a_modeling_decomposition_not_an_identification_claim = true

[latent_objects.N_workers_star_i_t]
symbol = "N_workers_star_i,t"
name = "latent worker quantity"
interpretation = "number of employed workers of origin i in period t"
unit = "persons"
kind = "latent_component"
block_membership = ["firm_block_as_effective_labor", "measurement_block"]
identification_status = "LATENT__BLOCKED_BY_H"
observed_by_any_source = false
never_a_feature = true
never_a_label = true

[latent_objects.h_star_i_t]
symbol = "h_star_i,t"
name = "latent hours / intensity"
interpretation = "effective hours per worker in the period, carrying declared duration and intensity content"
unit = "hours_per_person"
kind = "latent_component"
block_membership = ["firm_block_as_effective_labor", "measurement_block"]
identification_status = "LATENT__NOT_SEPARATELY_IDENTIFIED"
observed_by_any_source = false
never_a_feature = true
never_a_label = true

[latent_objects.e_star_i_t]
symbol = "e_star_i,t"
name = "latent efficiency per hour"
interpretation = "efficiency-labor units per hour; a declared per-worker basis is admissible only if stated and never mixed with the per-hour encoding inside one evaluation set"
unit = "efficiency_labor_units_per_hour"
kind = "latent_component"
block_membership = ["firm_block_as_effective_labor", "measurement_block"]
identification_status = "LATENT__NOT_SEPARATELY_IDENTIFIED"
observed_by_any_source = false
never_a_feature = true
never_a_label = true

[latent_objects.omega_i_t]
symbol = "omega_i,t"
name = "intensity-efficiency content per worker"
interpretation = "effective labor carried by one worker; the ONLY route by which a worker count can anchor ell_star"
unit = "efficiency_labor_units_per_person"
definition = "omega_i,t = h_star_i,t * e_star_i,t"
identification_status = "LATENT__PRIOR_REGULARIZED"
may_be_free_per_region = false
regularization_form_required = true

[latent_objects.A_i_t]
symbol = "A_i,t"
name = "productivity object of the registered production location"
unit = "declared_output_per_input_unit"
registration_tier = 4
specified_in_this_issue = false
block_membership = ["firm_block_registered_only", "measurement_block_registered_only"]
identification_status = "LATENT__PRIOR_REGULARIZED"

[latent_objects.G_i_t]
symbol = "G_i,t"
name = "government-investment / government-output block"
unit = "declared_output_unit"
registration_tier = 5
specified_in_this_issue = false
block_membership = ["government_block_registered_only", "measurement_block_registered_only"]
identification_status = "LATENT__PRIOR_REGULARIZED"
may_be_an_unbounded_provincial_balancing_residual = false

[identification_status_vocabulary]
allowed = [
  "STRUCTURALLY_DEFINED_NOT_OBSERVED",
  "LATENT__MEASUREMENT_DISCIPLINED",
  "LATENT__PRIOR_REGULARIZED",
  "LATENT__NOT_SEPARATELY_IDENTIFIED",
  "LATENT__BLOCKED_BY_H",
]
exactly_one_required_per_object_per_design = true
builder_may_upgrade_a_status = false
LATENT__MEASUREMENT_DISCIPLINED_requires = "a human-resolved H item and a declared measurement equation with a verified source"

[accounting]
tier = 1
imposed_exactly_never_fitted = true
identities = [
  "W_star_ii,t = 0",
  "W_star_ij,t >= 0",
  "sum over j != i of W_star_ij,t = 1",
  "P_ii,t = 1 - m_star_i,t",
  "P_ij,t = m_star_i,t * W_star_ij,t for j != i",
  "F_ij,t = ell_star_i,t * m_star_i,t * W_star_ij,t",
]
residual_may_enter_an_identity_as_a_free_parameter = false
pair_target_re_derived_here = false

[units]
W_star = "dimensionless"
m_star = "dimensionless"
ell_star = "efficiency_labor_units"
N_workers_star = "persons"
h_star = "hours_per_person"
e_star = "efficiency_labor_units_per_hour"
omega = "efficiency_labor_units_per_person"
F = "efficiency_labor_units"
L_obs = "persons"
H_obs = "hours"
ELL_obs = "efficiency_labor_units"
COV_obs = "persons"
coverage_factors = "dimensionless"
distance = "km_or_declared_monotone_transform"
beta_d = "per_distance_unit"
economic_gap = "dimensionless_declared_log_ratio_or_normalized_difference"
score_s = "dimensionless"
period_is_a_label_not_a_dimension = true
rules = [
  "U-1 ell_star is NOT a person count; equating them requires q_cov = 1 AND omega = 1, which is never assumed",
  "U-2 m_unit_basis and ell_unit must be reconcilable so that F = ell * m * W is dimensionally coherent",
  "U-3 a score term whose unit is not dimensionless after multiplying by its coefficient may not enter s_ij,t",
  "U-4 no measurement equation may contain a quantity of undeclared unit",
  "U-5 the accounting period is a LABEL, not a dimension; the period is never carried as a unit factor, which is why h_star is hours/person, ell_star is efficiency-labor units, omega = h_star * e_star is per-person and N_workers_star * omega = ell_star exactly",
]

[backbone]
status = "PRESERVED_AS_LATENT_FLOW_BACKBONE"
score = "s_ij,t = beta_d * distance_ij + beta_gap' * economic_gap_ij,t + beta_z' * Z_ij,t"
normalization = "W_star_ij,t = exp(s_ij,t) / sum over l != i, l in S_i,t of exp(s_il,t)"
diagonal = "W_star_ii,t = 0 exactly, excluded by construction"
required_terms = ["static_geographic_friction", "wage_or_income_opportunity_gap", "output_or_productivity_opportunity_gap"]
optional_terms = ["accessibility_terms_if_later_verified", "policy_or_friction_terms_if_later_verified"]
coefficients_are_symbolic = true
numeric_coefficient_values_frozen_here = 0
neural_replacement_required = false
ml_component_rule = "ADDITIVE_AUGMENTING_ONLY_SEPARATELY_IDENTIFIED_DIMENSIONALITY_DECLARED"
properties = [
  "B1 masked conditional normalization; diagonal falsified",
  "B2 support is a design object; never widened to fit an observation; never changed after outcomes",
  "B3 interpretability preserved because the accepted P2 result did not prefer the neural mapping",
  "B4 an ML component is additive only and never absorbs a structural term",
  "B5 all backbone coefficients symbolic; no value, sign estimate or prior magnitude frozen",
  "B6 declared expected signs are design priors, not findings",
  "B7 every gap and Z term must be available at window start",
  "B8 m_star, ell_star and same-period realized flows are never features",
  "B9 one declared gap form per design, applied to every origin-destination cell",
]
prohibited_in_backbone = [
  "any observation as an argument",
  "an undeclared per-pair free intercept",
  "re-tuning per wave or region after outcomes are seen",
]

[measurement.M1]
family = "residence_migration_observation"
observed_object = "T_obs^(k)_ij,t"
observed_meaning = "k-year residence-transition share, person-based, on the declared source frame"
latent_target = "Pp^(k)_ij,t"
latent_target_meaning = "latent k-step PERSON-based residence transition share, NOT a labor-service share and NOT W_star"
equation = "T_obs^(k)_ij,t = (1 - kappa_res_t) * Pp^(k)_ij,t * 1{j in frame} + zeta_res_ij,t + eps_res_ij,t"
active_wedge = "WEDGE_RES"
error_treatment = "declared moment condition or likelihood; zeta_res carries frame/timing terms and the reported unclassified bucket a_res_i,t"
required_declarations = ["frame", "universe", "reference_window_t_minus_k_to_t", "orientation", "diagonal_treatment", "weights", "missing_and_unknown_categories", "reference_date", "publication_vintage"]
prohibited = ["W_obs = W_star as an identity", "a labor-service reading of M1", "distributing an unclassified bucket", "using a post-reference-moment vintage unless declared"]
semantic_bridge = "the labor-service conditional share is reached only through the accepted P3B T-family bridge and the lambda / H5 route"
status = "NO_SOURCE_VERIFIED__BLOCKED_BY_H1_H3"
blocked_by = ["H1", "H3"]
claim_ceiling = "people-based multi-year residence transitions; never W_star"

[measurement.M2]
family = "employment_count_observation"
observed_object = "L_obs_i,t"
latent_target = "N_workers_star_i,t"
equation = "L_obs_i,t = q_cov_i,t * N_workers_star_i,t + eps_L_i,t"
active_wedge = "WEDGE_COV"
required_declarations = ["source_frame", "institutional_coverage_basis", "unit_persons_jobs_or_posts", "region_universe", "reference_period", "weighting_status"]
prohibited = ["numeric q_cov", "q_cov equal to one for all sources", "equating a job count with a worker count without a declared equation"]
status = "NO_SOURCE_VERIFIED__BLOCKED_BY_H2_H4"
blocked_by = ["H2", "H4"]
claim_ceiling = "partial observation of worker quantity; never ell_star"

[measurement.M3]
family = "hours_intensity_observation"
observed_object = "H_obs_i,t"
latent_target = "h_star_i,t"
equation = "H_obs_i,t = q_hours_i,t * (N_workers_star_i,t * h_star_i,t) + eps_H_i,t"
absent_case = "if no hours source exists, h_star must be carried by a declared L_* prior form with a sensitivity replicate; it may not be a hidden constant and may not be free per region"
active_wedge = "WEDGE_HOURS"
required_declarations = ["source_basis", "per_worker_or_per_job", "reference_period"]
prohibited = ["inferring long hours from worker counts", "substituting a worker count for hours"]
status = "NO_SOURCE_VERIFIED__BLOCKED_BY_H2_H4"
blocked_by = ["H2", "H4"]
claim_ceiling = "partial hours-margin observation; no proof that h_star is identified"

[measurement.M4a]
family = "efficiency_labor_observation_direct"
observed_object = "ELL_obs_i,t"
latent_target = "ell_star_i,t"
equation = "ELL_obs_i,t = q_eff_i,t * ell_star_i,t + eps_eff_i,t"
active_wedge = "WEDGE_EFF"
ell_unit = "EFFICIENCY_LABOR"
required_declarations = ["ell_unit", "unit_with_hours_and_efficiency_content", "timing_precedes_or_coincides", "coverage_versus_label_universe", "C_LINK_status"]
prohibited = ["substituting total population, urbanization or an unrelated total", "deriving ell from an unrelated aggregate", "equating person counts with efficiency labor"]
status = "NO_SOURCE_VERIFIED__BLOCKED_BY_H6"
blocked_by = ["H6"]
claim_ceiling = "partial efficiency-labor observation"

[measurement.M4b]
family = "efficiency_labor_observation_declared_proxy"
observed_object = "N_obs_i,t"
observed_meaning = "employed-persons proxy observation"
latent_target = "ell_star_i,t jointly with N_workers_star_i,t and omega_i,t"
equations = [
  "N_obs_i,t = q_cov_i,t * N_workers_star_i,t + eps_L_i,t",
  "ell_star_i,t = omega_i,t * N_workers_star_i,t",
  "omega_i,t = h_star_i,t * e_star_i,t",
]
active_wedge = ["WEDGE_COV", "WEDGE_OMEGA"]
ell_unit = "EMPLOYED_PERSONS_DECLARED_AS_PROXY"
proxy_measures = "worker_quantity_not_ell_star"
identity_prohibited = "ell_star_i,t != N_obs_i,t unless q_cov = 1 AND omega = 1, which is NEVER assumed"
identity_is_a_declared_sensitivity_variant_only = "ELL_PROXY_UNIT_INTENSITY_VARIANT"
required_declarations = ["ell_unit", "explicit_proxy_status", "sensitivity_replicate", "ELL_PROXY_IDENTITY_NOT_ASSUMED"]
status = "NO_SOURCE_VERIFIED__BLOCKED_BY_H6"
blocked_by = ["H6"]
claim_ceiling = "noisy anchor for ell_star under the declared proxy basis; never ell_star itself"

[measurement.M5]
family = "covered_uncovered_employment_channel"
observed_object = "COV_obs_i,t"
observed_meaning = "social-insurance enrollment, unit-employment count, or an equivalent institutional channel"
decomposition = "N_workers_star_i,t = N_cov_star_i,t + N_unc_star_i,t"
equation = "COV_obs_i,t = q_si_i,t * N_cov_star_i,t + eps_cov_i,t"
registry_entry = "WEDGE_SI_COVERAGE"
required_declarations = ["channel_identity", "institutional_coverage_basis", "region_universe", "period"]
prohibited = [
  "numeric q_si",
  "equating social-insurance enrollment with total employment",
  "assuming an informal or uncovered share numerically",
  "inventing, borrowing or defaulting an undercoverage rate",
]
status = "MEASUREMENT_CHANNEL_DECLARED_NOT_CALIBRATED"
blocked_by = ["H2", "H4"]
claim_ceiling = "a declared channel for a coverage split; never a measured undercoverage rate"

[measurement.M6]
family = "macro_production_anchor_registered_only"
observed_objects = ["Y_obs_i,t", "K_obs_i,t", "w_obs_i,t", "G_obs_i,t"]
latent_targets = ["A_i,t", "K_star_i,t", "ell_star_i,t", "G_i,t"]
specified_in_this_issue = false
purpose = "register the moment side of the residual budget; no functional form, elasticity, share parameter or government rule is chosen here"
prohibited = ["choosing a production function here", "choosing an elasticity or share parameter here", "using these symbols for any quantitative claim in this issue"]
status = "REGISTERED_NOT_SPECIFIED_IN_THIS_ISSUE"
blocked_by = ["H2", "H7"]
claim_ceiling = "registered locations only"

[wedges.WEDGE_RES]
tier = 3
symbol = "kappa_res_t"
unit = "dimensionless"
equation_location = "M1"
economic_interpretation = "residence classification, timing and multi-year aggregation discrepancy; a measurement discrepancy, NOT an economic migration cost"
disciplining_source_or_moment = "H1/H3 source semantics, resolved by documentation, not by fitting"
allowed_dimensionality = "wave-level and source-level scalars; a declared semantic variant; never a per-pair or per-origin free residual"
prior_or_regularization = "resolved value when H1 resolves the mapping; otherwise a declared L_* form with a stated prior"
sensitivity_requirement = "residence-semantics variant replicate"
claim_ceiling = "a measurement discrepancy; never a migration barrier, cost or friction"
may_be_free_without_anchor_or_prior = false
free_parameter_count_per_region_and_period = "FORBIDDEN"
fail_closed_when_h_unresolved = true
record_complete = true

[wedges.WEDGE_COV]
tier = 3
symbol = "q_cov_i,t"
unit = "dimensionless"
equation_location = "M2 and M4b"
economic_interpretation = "institutional frame of an employment count relative to the latent worker universe"
disciplining_source_or_moment = "M5 channel if a source supports it; otherwise the macro employment accounting identity"
allowed_dimensionality = "declared L_* form; a per-region-per-period free vector is forbidden without an anchor, prior or grouping"
prior_or_regularization = "declared prior with a reported sensitivity"
sensitivity_requirement = "anchored versus prior-only replicate"
claim_ceiling = "coverage of a specific source; never a labor-supply distortion and never an economy-wide undercoverage rate"
may_be_free_without_anchor_or_prior = false
fail_closed_when_h_unresolved = true
record_complete = true

[wedges.WEDGE_HOURS]
tier = 3
symbol = "q_hours_i,t"
unit = "dimensionless"
equation_location = "M3"
economic_interpretation = "reporting basis of an hours or intensity measure"
disciplining_source_or_moment = "the M3 source if it exists; otherwise a declared prior"
allowed_dimensionality = "declared L_* form"
prior_or_regularization = "required prior; h_star may not be free per region"
sensitivity_requirement = "prior-scaled replicate"
claim_ceiling = "a measurement basis; never a leisure or labor-supply preference"
may_be_free_without_anchor_or_prior = false
fail_closed_when_h_unresolved = true
record_complete = true

[wedges.WEDGE_EFF]
tier = 3
symbol = "q_eff_i,t"
unit = "dimensionless"
equation_location = "M4a"
economic_interpretation = "efficiency-labor content discrepancy of a source relative to the latent effective labor object"
disciplining_source_or_moment = "the M4a source if it exists; otherwise a declared prior"
allowed_dimensionality = "declared L_* form"
prior_or_regularization = "required prior, jointly with the h/e split status"
sensitivity_requirement = "split-sensitivity replicate, with WEDGE_OMEGA"
claim_ceiling = "a measurement basis; never a technology or human-capital claim"
may_be_free_without_anchor_or_prior = false
fail_closed_when_h_unresolved = true
record_complete = true

[wedges.WEDGE_OMEGA]
tier = 3
symbol = "omega_i,t = h_star_i,t * e_star_i,t"
unit = "efficiency_labor_units_per_person"
equation_location = "M4b"
economic_interpretation = "effective labor carried by one worker; the only route by which a worker count can anchor ell_star"
disciplining_source_or_moment = "M3 and M4a jointly if both exist; otherwise the declared prior"
allowed_dimensionality = "declared L_* form; free per region is forbidden"
prior_or_regularization = "required, with the functional form declared"
sensitivity_requirement = "ELL_PROXY_UNIT_INTENSITY_VARIANT reported as its own row"
claim_ceiling = "a decomposition; never an identified productivity level"
may_be_free_without_anchor_or_prior = false
fail_closed_when_h_unresolved = true
record_complete = true

[wedges.WEDGE_TFP]
tier = 4
symbol = "A_i,t"
unit = "declared_output_per_input_unit"
equation_location = "M6 registered production location"
economic_interpretation = "total-factor-productivity or productivity object of the registered production mapping"
disciplining_source_or_moment = "declared macro moments: output, capital, wage"
allowed_dimensionality = "declared low-dimensional form, aggregate or sector"
prior_or_regularization = "required"
sensitivity_requirement = "productivity-prior replicate"
claim_ceiling = "a registered productivity object; never an identified causal effect"
may_be_free_without_anchor_or_prior = false
fail_closed_when_h_unresolved = true
record_complete = true

[wedges.WEDGE_GOV]
tier = 5
symbol = "G_i,t"
unit = "declared_output_unit"
equation_location = "M6 registered government location"
economic_interpretation = "an explicit government-investment / government-output economic block"
disciplining_source_or_moment = "its own declared anchor G_obs or a declared prior, plus a moment set disjoint from every labor wedge"
allowed_dimensionality = "bounded by its declared low-dimensional form; an unbounded province-by-province free form is forbidden"
prior_or_regularization = "anchor or prior required"
sensitivity_requirement = "anchor-relaxation replicate"
claim_ceiling = "an economic block with its own moments; never a provincial balancing residual that closes output"
may_be_free_without_anchor_or_prior = false
fail_closed_when_h_unresolved = true
record_complete = true
may_be_unbounded_balancing_residual = false

[wedges.required_record_fields]
fields = ["symbol", "equation_location", "economic_interpretation", "disciplining_source_or_moment", "allowed_dimensionality", "prior_or_regularization", "sensitivity_requirement", "claim_ceiling"]
incomplete_record_status = "WEDGE_RECORD_INCOMPLETE__NOT_ADMISSIBLE"

[wedge_identification_rules]
rules = [
  "I1 every wedge carries the complete eight-field record before it appears in any equation",
  "I2 every wedge declares its dimensionality and free-parameter count; undeclared or unbounded dimensionality is UNRESTRICTED_WEDGE_FORBIDDEN",
  "I3 a wedge whose free directions span regions and periods without an anchor, prior or grouping is forbidden",
  "I4 an unidentified split may not have both partners free; exactly one is free and the split status is reported honestly",
  "I5 the six-element set {labor coverage, hours, efficiency, migration, TFP, government} may not be simultaneously unrestricted",
  "I6 when the source that would discipline a wedge is unresolved in H1-H7, the wedge is fixed by prior or the affected dimension set is excluded (H_BLOCKED_WEDGE_FAIL_CLOSED); it is never freed",
  "I7 no wedge may be introduced solely to close provincial output or GDP without an explicit moment or prior",
  "I8 no wedge value may be reported as data-identified unless a source-specific measurement contract proves it",
  "I9 every active wedge reports its sensitivity replicate; a missing replicate is a reporting defect",
  "I10 a wedge failing any rule makes the design RESIDUAL_BUDGET_EXCEEDED__NOT_ADMISSIBLE",
]
