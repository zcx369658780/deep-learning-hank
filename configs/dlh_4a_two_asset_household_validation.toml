# DLH-4A two-asset HANK household HJB/KFE reconstruction validation fixture —
# VALIDATION_FIXTURE_NOT_CALIBRATION
# TWO_ASSET_HANK_HOUSEHOLD_KERNEL_ONLY
#
# Issue #17 frozen validation fixture. Values are numerical validation fixtures
# ONLY, not calibration. The household kernel is solved at given aggregate
# prices (w, rb, ra, Tt, tau); no firm/monetary/fiscal/regional closure is
# included. Grid dimensions and preference/adjustment parameters mirror the
# legacy Matlab reference HANK_2ASSETS_HJB.m (read-only reference) to enable
# future structural/numerical comparison.

[fixture]
frequency = "annual"
# Liquid asset grid (can be negative -> borrowing with premium rb_gap).
b_min = -2.0
b_max = 5.0
b_points = 20
# Illiquid asset grid (a >= 0).
a_min = 0.0
a_max = 10.0
a_points = 20
# Idiosyncratic productivity (two-state CTMC).
idiosyncratic_states = [0.8, 1.3]
q_low_to_high = 0.3333333333333333
q_high_to_low = 0.3333333333333333

[household]
rho = 0.05
gamma = 2.0
alphac = 1.0
alphal = 1.0
frisch_l = 0.2
n_max = 5.0
tau_l = 0.15
w = 1.0
rb = 0.02
rb_gap = 0.01
ra = 0.04
Tt = 0.0
consumption_floor = 1e-6

[adjustment]
chi0 = 0.1
chi1 = 2.0
# a_bar: scale floor for the adjustment cost and the (consistent) transfer FOC.
# The legacy reference used a_bar = 1e-6 with a transfer scaled by `a` (so
# d = 0 at a = 0 -> absorbing).  This fixture uses a_bar = 1.0 with the
# cost-consistent scale max(a, a_bar) to keep the stationary distribution
# non-degenerate; documented in DLH_4A_PRECODING_MAPPING.md.
a_bar = 1.0
fixcost = 0.0
fixcost2 = 0.0

[numerical]
pseudo_time_step = 1000.0
value_change_tolerance = 1e-7
max_value_iterations = 1000
generator_row_sum_tolerance = 1e-6
generator_min_off_diagonal_tolerance = -1e-10
kfe_stationarity_tolerance = 1e-8
kfe_mass_tolerance = 1e-10
negative_mass_threshold = -1e-12
reproducibility_tolerance = 1e-12
