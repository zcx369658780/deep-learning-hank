# DLH-2C variant P40_50 — VALIDATION_FIXTURE_NOT_CALIBRATION
#
# Numerical validation fixture ONLY; never empirical calibration.
# Identical to the accepted B40_50 baseline (40 points on [0,50]) except the
# productivity-state ordering is reversed from (0.5,1.5) to (1.5,0.5), with
# the CTMC state labels reversed consistently.  Transition intensities are
# symmetric (0.25/0.25), so this is a pure state-label representation
# permutation, not an economic change.

[fixture]
frequency = "annual"
asset_grid_count = 40
a_min = 0.0
a_max = 50.0
idiosyncratic_states = [1.5, 0.5]
q_low_to_high = 0.25
q_high_to_low = 0.25
rho_hh = 0.01
gamma = 2.0
tau_l = 0.15

[root]
A = 1.0
alpha_k = 0.30
delta = 0.02
G = 0.0
capital_bracket = [0.5, 45.0]
scan_bounds = [0.1, 49.0]
scan_points = 98

[numerical]
hjb_tolerance = 1e-7
hjb_max_iterations = 2000
hjb_pseudo_time_step = 1000.0
consumption_floor = 1e-10
kfe_stationarity_tolerance = 1e-8
kfe_mass_tolerance = 1e-10
negative_mass_threshold = -1e-12
generator_row_sum_tolerance = 1e-12
generator_min_off_diagonal_tolerance = -1e-14
outer_capital_tolerance = 1e-7
outer_max_iterations = 200
reproducibility_tolerance = 1e-12
