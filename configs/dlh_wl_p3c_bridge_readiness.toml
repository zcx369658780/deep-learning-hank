# DLH-WL-P3C — bridge execution-readiness freeze (machine-readable).
#
# Issue #82 / `DLH-WL-P3C`. Owner route: DLH-WL-V1-20260918.
# Authority marker: DLH_WL_P3C_EXECUTION_READINESS_FREEZE_AUTHORIZED.
# Reviewer final activation comment: 5741497930.
# Reviewer HOLD remediated by this revision: 5741651898.
#
# This file freezes the numerical, search and claim contract for the FIRST real
# T-family bridge execution. It contains NO empirical value: no transition matrix,
# no root, no m, no ell, no W, no region mass.
#
# Consistency rule: every numeric value below is copied verbatim from the Issue #82
# body and the activation comment, and all sixteen are unchanged by the HOLD
# remediation of comment 5741651898. No value may be relaxed after a real bridge
# outcome is observed.
#
# Companion documents:
#   docs/specifications/DLH_WL_P3C_EXECUTION_READINESS_FREEZE_2026_09_19.md
#   docs/data/DLH_WL_P3C_HUMAN_SOURCE_VERIFICATION_PACKET_2026_09_19.md
#   reports/dlh_wl_p3c_2026_09_19/DLH_WL_P3C_REPORT.md

schema_version = "DLH_WL_P3C_READINESS_V2"
frozen_utc_date = "2026-09-19"

[authority]
issue = 82
task_id = "DLH_WL_P3C_EXECUTION_READINESS_FREEZE"
authority_marker = "DLH_WL_P3C_EXECUTION_READINESS_FREEZE_AUTHORIZED"
owner_route = "DLH-WL-V1-20260918"
route_lock = "DLH_WL_V1_20260918"
activation_comment = 5741497930
remediation_hold_comment = 5741651898
operative_baseline = "2b7b0b7d506907ecbf41509bc526ad2b5ea794a6"
publication_baseline = "60d71ec068c044f73da0f56e86b1cb4bbf7c4a8d"
inherited_preregistration_issue = 81
inherited_preregistration_integration = "1819b0a5a36b2a8ffde3641c711892df2cdcede7"
binding_hierarchy = [
  "owner_route",
  "accepted_P1B_P3A_semantics",
  "accepted_P3B_preregistration",
  "issue_82_body",
  "activation_comment_5741497930",
  "hold_remediation_5741651898",
]
frozen_before_any_real_transition_matrix = true
relaxation_after_outcome_observed = false
numeric_thresholds_unchanged_by_remediation = true
amendment_rule = "Only a dated pre-execution Reviewer amendment may replace a value in this file."

[scope]
real_bridge_executed = false
real_transition_matrix_inspected = false
data_downloaded_scraped_purchased_ingested = false
empirical_adapter_created = false
fit_training_estimation_performed = false
hjb_kfe_ge_matlab_household_calls = 0
pytest_or_full_suite_runs = 0

# --------------------------------------------------------------------------- thresholds
[thresholds.low_mobility]
route = "T2"
pi_max = 0.15
definition = "pi^(k) = max_i ( 1 - T^(k)_ii )"
eligibility_rule = "T2 is eligible for a window only if pi^(k) <= pi_max AND the T2 support eligibility check below passes"
evaluated_per = "window"
rationale = "at k = 5 the leading matrix-error scale (pi^(k))^2 / k is approximately 0.0045 at the boundary, which keeps the low-mobility route in a deliberately conservative regime"
is_a_claim_about_real_data = false
kind = "methodological_tolerance"

[thresholds.identification_spread]
tau_W_abs = 0.02
tau_m_abs = 0.02
evaluated_per = "window"
W_spread_definition = "max over branches-with-positive-outflow origins and admissible (i,j), j != i, and over pairs P,Q in F_search_tol, of abs( W_ij(P) - W_ij(Q) )"
m_spread_definition = "max over all origins i and over pairs P,Q in F_search_tol, of abs( m_i(P) - m_i(Q) )"
W_spread_origin_scope = "only origins with m_i(P) > 0 in every retained candidate; degenerate origins are excluded and reported"
m_spread_origin_scope = "all origins; m_i = 1 - P_ii is defined even when m_i = 0, so no origin is excluded from the m spread"
vacuous_value_when_single_candidate = 0.0
fail_status = "NOT_IDENTIFIED_BY_ANNUALIZATION"
pass_status = "SEARCH_SET_STABLE_WITHIN_PREREGISTERED_TOLERANCE"
pass_status_grants_global_uniqueness = false
degenerate_m_is_not_a_window_failure = true
degenerate_m_rule = "an origin with m_i(P) = 0 is marked TARGET_UNAVAILABLE_DEGENERATE_OUTFLOW for that candidate; the window's identification status is unaffected and the other origins are evaluated normally"

[thresholds.region_mapping]
unmappable_mass_share_max = 0.01
evaluated_per = "source_origin_time_block"
definition = "share of the block's mass that cannot be assigned to the pinned canonical universe after declared exclusions and merges"
exceed_action = "FAIL_CLOSED_WHOLE_BLOCK"
redistribution_or_imputation_allowed = false
mass_threshold_numeric_choice = "frozen_here_by_issue_82"

# --------------------------------------------------------------------------- numerical validity
[numerical.row_stochasticity]
row_sum_abs_tol = 1e-10
check = "abs( sum_j P_ij - 1 ) <= row_sum_abs_tol for every origin row"

[numerical.negativity]
hard_failure_below = -1e-10
cosmetic_zero_lower = -1e-12
cosmetic_zero_upper_exclusive = 0.0
sign_ambiguous_band = "[-1e-10, -1e-12)"
sign_ambiguous_status = "NUMERIC_SIGN_AMBIGUOUS__NOT_BRIDGE_USABLE"
sign_ambiguous_action = "RECORD_RAW_SOLVER_CANDIDATE_FOR_DIAGNOSTICS_ONLY"
sign_ambiguous_enters_search_set = false
sign_ambiguous_enters_spread = false
sign_ambiguous_enters_bridge_selection = false
sign_ambiguous_enters_m_or_W = false
sign_ambiguous_counted_as_admissible = false
sign_ambiguous_rationale = "a matrix retaining a negative entry is not entrywise non-negative, so it is not a probability matrix and may not be used as a W or m source; the frozen hard-failure and cosmetic-zero thresholds are unchanged"
entry_into_search_set_requires = "the retained post-canonicalization matrix is entrywise >= 0"
cosmetic_zero_ordering = "only after all other validity checks have been established on the candidate matrix"
cosmetic_zero_recheck = "after zeroing, the row-sum, annual-support and root-residual checks are re-run on the retained matrix"
cosmetic_zero_delta_recorded = true

[numerical.support]
forbidden_support_mass_tol = 1e-12
annual_candidate_cleanup_check = "max over forbidden annual direct (i,j) of abs(P_ij) <= forbidden_support_mass_tol, for the candidate ANNUAL matrix P only"
annual_candidate_sum_recorded = true
multistep_mass_on_non_annual_pair = "EXPECTED_AND_RECORDED_NOT_A_FAILURE"
multistep_mass_explanation = "if the annual direct edge i->j is forbidden, T^(k)_ij may still be positive through an allowed indirect path i->l->...->j; positive mass there is a property of a k-step matrix and is not a contradiction of the observed window"
multistep_mass_recorded_as = "MULTISTEP_MASS_ON_NON_ANNUAL_PAIR diagnostic"
Tk_side_global_block_failure = false
Tk_side_global_block_failure_removed_by = "hold_remediation_5741651898"
t2_support_eligibility_check = "T2 is ineligible for a window if any T^(k)_ij > forbidden_support_mass_tol on a pair forbidden by the annual transition support, because P_hat_ij = T^(k)_ij / k would violate the annual support mask"
t2_support_eligibility_failure_status = "T2_SUPPORT_ELIGIBILITY_FAIL"
t2_support_eligibility_scope = "T2 only; routes R1, R2 and R4 are unaffected and are validated on the candidate annual matrix alone"
w_support_diagonal_always_false = true
w_support_is_separate_object = true
transition_support_diagonal_allowed = true
support_mask_widening_to_fit_an_observation_allowed = false

[numerical.root_residual]
k_step_max_abs_residual = 1e-8
residual_definition = "max_abs( P^k - T^(k) )"
objective = "frobenius_squared_norm_of_Pk_minus_Tk"
retention_rule = "a candidate is retained in F_search_tol only if residual_definition <= k_step_max_abs_residual and every other frozen check passes"
objective_value_recorded = true
residual_value_recorded = true
retained_candidate_status = "NUMERICALLY_ADMISSIBLE_EPSILON_ROOT_CANDIDATE"
residual_bound_does_not_imply_exact_root = true
residual_bound_note = "residual <= 1e-8 is a backward-error statement about P^k - T^(k); it does not by itself establish that an exact mathematical root exists nearby, which would require a separate perturbation or conditioning argument"
exact_root_certified_field = "exact_root_certified"
exact_root_certified_default = false
exact_root_certified_rule = "true only if an analytical, interval, verified-continuation or equivalent computation proves P^k = T^(k) exactly"

[numerical.generator]
row_sum_abs_tol = 1e-10
offdiagonal_hard_failure_below = -1e-10
checks = [
  "abs( sum_j Q_ij ) <= row_sum_abs_tol for every origin row",
  "no off-diagonal below offdiagonal_hard_failure_below",
  "P = exp(Q) satisfies every row-stochasticity, negativity, annual-support and root-residual check",
]
generator_uniqueness_claimed = false

[numerical.reality]
imaginary_part_abs_tol = 1e-10
applies_to = ["candidate_real_matrix", "candidate_real_root", "candidate_real_logarithm"]

[numerical.dedup]
max_abs_separation = 1e-7
definition = "two retained candidates P_a, P_b are the same discovered candidate for reporting iff max_abs(P_a - P_b) <= max_abs_separation"
applies_to = "F_search_tol_reporting"

# --------------------------------------------------------------------------- row availability
[row_availability]
degenerate_outflow_status = "TARGET_UNAVAILABLE_DEGENERATE_OUTFLOW"
trigger = "m_i(P) = 0 for origin i in a retained candidate"
scope = "the affected origin row only"
window_status_affected = false
other_origins_evaluated_normally = true
degenate_origin_excluded_from_W_spread = true
degenerate_origin_excluded_from_supervised_rows = true
uniform_W_fabrication_allowed = false
degenerate_origin_count_and_list_reported_per_candidate = true
negative_m_status = "INVALID_STOCHASTIC_CANDIDATE"
negative_m_rule = "m_i = 1 - P_ii < 0 requires P_ii > 1, which the negativity and row-sum checks already reject; a negative m can never occur in a valid candidate"
all_origins_degenerate_rule = "supervised_origin_count = 0 means no empirical W target is emitted for that window; the window's root status is unaffected"
whole_panel_completeness = "SEPARATE_DESIGN_GATE_NOT_ANNUALIZATION_IDENTIFICATION"
whole_panel_completeness_note = "if a future empirical design separately requires a complete all-origin panel, that completeness rule may fail the window, but that is a separate design gate and not annualization non-identification"

# --------------------------------------------------------------------------- search protocol
[search]
routes_in_execution_order = [
  "R1_principal_real_kth_root",
  "R2_generator_embedding",
  "R3_low_mobility_T2_initialization",
  "R4_constrained_multistart_root_search",
]
route_order_is_execution_order_only = true
bridge_convention_preference_owner = "P3B section 2.6"
bridge_convention_preference_order = [
  "generator_embedding",
  "principal_real_nonnegative_kth_root",
  "low_mobility_T2_when_C1_passes",
  "fail_closed",
]
all_applicable_routes_must_run = true
outcome_driven_stopping_allowed = false

[search.R1_principal_real_kth_root]
retain_only_if = "real within imaginary_part_abs_tol, entrywise non-negative after permitted cosmetic zeroing, row-stochastic within row_sum_abs_tol, annual-support valid, and root residual within k_step_max_abs_residual"
support_checked_on = "the candidate annual matrix P only; P^k may carry multistep mass on non-annual pairs"

[search.R2_generator_embedding]
logarithm = "Q = (1/k) log( T^(k) )"
retain_only_if = "Q satisfies the generator checks and P = exp(Q) satisfies every stochastic, annual-support and root-residual check"
generator_uniqueness_claimed = false
support_checked_on = "the candidate annual matrix P only"

[search.R3_low_mobility_T2_initialization]
eligible_only_if = "C1 passes, i.e. pi^(k) <= pi_max, AND the T2 support eligibility check passes"
ineligibility_status = "T2_SUPPORT_ELIGIBILITY_FAIL"
ineligibility_scope = "T2 only; R1, R2 and R4 are unaffected"
role = "initialization_candidate_only"
exact_root_status_requires = "the candidate must independently pass the root residual before it may be called an exact root"
report_status_when_eligible = "LOW_MOBILITY_APPROXIMATION__PREREGISTERED"

[search.R4_constrained_multistart]
rng_family = "numpy.random.Generator, PCG64, constructed by numpy.random.default_rng"
rng_family_ratified_by_reviewer = true
rng_seed = 20260919
total_executed_optimizer_starts = 64
total_executed_optimizer_starts_invariant = true
max_iterations_per_start = 5000
extra_starts_after_observing_results = false
restarts_allowed = false
search_family_change_after_observing_results = false
parameterization = "allowed_support_row_simplex_bound_constrained"
parameterization_note = "one free vector per origin row over that row's allowed annual transition support; bounds 0 <= P_ij <= 1 per entry; one equality constraint sum_j P_ij = 1 per row; annual structural zeros held at exactly 0 by removing them from the variable set"
softmax_row_parameterization_used = false
softmax_row_parameterization_rejection_reason = "a softmax parameterization cannot attain an exact interior zero, which would place admissible candidates outside the reach of F_search_tol and silently weaken the completeness question"
objective = "frobenius_squared_norm_of_Pk_minus_Tk"
convergence_and_validity_decided_only_by = "the frozen tolerances in this file"
non_converged_start_action = "RECORD_AS_NOT_CONVERGED_NO_RESTART"
search_is_joint_over_all_origins = true
start_distribution = "dirichlet_with_alpha_ones_on_the_allowed_support_row_simplex"
start_distribution_status = "REVIEWER_RATIFIED_PRE_EXECUTION_SEARCH_DESIGN_CONSTANT"
start_distribution_is_an_empirical_threshold = false
start_distribution_ratified_by_reviewer_in = 5741651898
special_start_candidates = [
  "identity",
  "T2_candidate",
  "principal_root_candidate",
  "embedding_candidate",
]
n_special_valid_definition = "the number of valid starts among the four special start candidates for this window"
special_start_validity = "a special candidate is valid only if it satisfies every entry condition it is eligible for; an ineligible or invalid special candidate is not an optimizer start"
random_start_count_formula = "64 - n_special_valid"
total_executed_starts_formula = "n_special_valid + (64 - n_special_valid) = 64"
special_starts_consume_rng_draws = false
special_start_unavailable_ledger_required = true
special_start_unavailable_counted_as_optimizer_start = false
start_draw_order = "origin rows in ascending canonical index order; within a row, the allowed-support entries in ascending canonical index order; start indices in ascending order"
start_stream_version_dependent = true
numpy_version_recorded = true
start_manifest_hash_required = true
start_manifest_hash_scope = "all 64 executed optimizer starts"
start_manifest_hash_purpose = "make the actual 64 starts auditable even if a future numpy release changes the Generator stream"

# --------------------------------------------------------------------------- claim boundary
[root_sets]
exact_set = "F_all_exact"
exact_set_definition = "the mathematical set of all annual stochastic matrices P that satisfy P^k = T^(k) EXACTLY, under the declared annual transition support"
search_set = "F_search_tol"
search_set_definition = "the finite set of NUMERICALLY ADMISSIBLE EPSILON-ROOT CANDIDATES retained by the preregistered numerical search under the frozen tolerances, after deduplication"
search_set_member_status = "NUMERICALLY_ADMISSIBLE_EPSILON_ROOT_CANDIDATE"
unconditional_subset_claim_removed = true
unconditional_subset_claim_removed_by = "hold_remediation_5741651898"
F_search_tol_is_subset_of_F_all_exact = "NOT_ASSERTED"
certified_subset_rule = "only candidates with exact_root_certified = true are asserted to be members of F_all_exact"
certified_subset = "{ P in F_search_tol : exact_root_certified(P) = true } is a subset of F_all_exact"
F_search_tol_may_be_called_F_all_exact = false
F_search_tol_may_be_called_complete_or_global = false
completeness_requires = "a separate analytical, interval, verified-continuation or equivalent mathematical certificate covering the admissible domain"
spread_diagnostics_scope = "F_search_tol only; they are search-defined sensitivity evidence and are never a proof about the complete exact-root set"
P3B_alias_map = { "F_all_exact" = "P3B_calligraphic_F_of_Tk", "F_search_tol" = "P3B_F_enum_tolerance_only" }

[status_vocabulary.uniqueness]
allowed = [
  "GLOBAL_UNIQUENESS_CERTIFIED",
  "MULTIPLE_NUMERICALLY_ADMISSIBLE_ROOT_CANDIDATES_FOUND",
  "ONE_NUMERICALLY_ADMISSIBLE_ROOT_CANDIDATE_FOUND__GLOBAL_NONUNIQUENESS_NOT_EXCLUDED",
  "NO_NUMERICALLY_ADMISSIBLE_ROOT_CANDIDATE_FOUND__EXISTENCE_NOT_PROVEN",
]
exactly_one_required_per_window = true
GLOBAL_UNIQUENESS_CERTIFIED_requires_certificate = true
one_candidate_found_status = "ONE_NUMERICALLY_ADMISSIBLE_ROOT_CANDIDATE_FOUND__GLOBAL_NONUNIQUENESS_NOT_EXCLUDED"
zero_candidates_found_status = "NO_NUMERICALLY_ADMISSIBLE_ROOT_CANDIDATE_FOUND__EXISTENCE_NOT_PROVEN"
candidates_are_tolerance_level = true
exact_certificate_is_a_separate_per_candidate_flag = true

[status_vocabulary.window]
allowed = [
  "NOT_IDENTIFIED_BY_ANNUALIZATION",
  "SEARCH_SET_STABLE_WITHIN_PREREGISTERED_TOLERANCE",
]

[status_vocabulary.route]
allowed = [
  "C1_FAILED",
  "T2_SUPPORT_ELIGIBILITY_FAIL",
]
C1_FAILED_meaning = "the pi_max applicability check C1 (P3B section 2.3) failed, so the T2 route is not usable for that window; the other routes are unaffected"
T2_SUPPORT_ELIGIBILITY_FAIL_meaning = "the T2-only support eligibility check failed on the observed k-step window; scoped to T2, and added by hold_remediation_5741651898"

[status_vocabulary.row]
allowed = ["TARGET_UNAVAILABLE_DEGENERATE_OUTFLOW"]

[status_vocabulary.t2]
allowed = ["LOW_MOBILITY_APPROXIMATION__PREREGISTERED"]

[status_vocabulary.forbidden]
terms = [
  "UNIQUE_ROOT",
  "GLOBALLY_UNIQUE",
  "NO_ROOT_EXISTS",
  "NON_EXISTENCE_PROVEN",
  "F_search_IS_F_all",
  "COMPLETE_ROOT_SET",
  "ALL_ROOTS_FOUND",
  "MULTIPLE_ADMISSIBLE_ROOTS_FOUND",
  "ONE_ROOT_FOUND__GLOBAL_NONUNIQUENESS_NOT_EXCLUDED",
  "NO_ADMISSIBLE_ROOT_FOUND__EXISTENCE_NOT_PROVEN",
  "ADMISSIBLE_ROOTS_FOUND",
]
rule = "a forbidden term may appear only inside a statement that it is forbidden or superseded"
superseded_note = "the last four terms are the pre-remediation wording; they are forbidden because they described tolerance-level candidates as admissible roots"

[claim_ceiling]
one_candidate_found = "the selected bridge is assumption-defined and search-defined, never data-identified; the candidate is a numerically admissible epsilon-root candidate, not a proven exact root"
multiple_candidates_within_tolerance = "SEARCH_SET_STABLE_WITHIN_PREREGISTERED_TOLERANCE may be claimed over F_search_tol; global uniqueness still may not"
multiple_candidates_outside_tolerance = "NOT_IDENTIFIED_BY_ANNUALIZATION; no empirical W target is emitted"
zero_candidates_found = "existence is not proven; non-existence is not proven either"
generator_or_principal_preference = "selects a bridge convention, not an identification theorem; alternative discovered candidates and their spreads remain reportable"
T2 = "an approximation reported as LOW_MOBILITY_APPROXIMATION__PREREGISTERED unless it independently passes the exact root residual"
degenerate_origin = "reported as TARGET_UNAVAILABLE_DEGENERATE_OUTFLOW for that row; it is not a window-level identification failure and no uniform W is fabricated"
residual_bound = "residual <= 1e-8 does not establish the existence of an exact root nearby; that requires a separate perturbation or conditioning argument"

# --------------------------------------------------------------------------- provenance separation
[provenance]
pair_level_field = "lambda_ij"
pair_level_definition = "expected labor service per observed mover or person, conditional on i -> j"
origin_level_field = "ell_i"
origin_level_definition = "total origin labor amount entering F_ij = ell_i * m_i * W_ij"
lambda_and_ell_are_separate_provenance_fields = true
lambda_may_be_inferred_from_ell = false
ell_may_be_inferred_from_lambda = false
consistency_condition_id = "C-LINK"
consistency_condition = "ell_i = ell_i^movers + ell_i^stay + ell_i^unobserved"
consistency_condition_rule = "supply all three components from one coherent frame, or declare which are unobserved and report the residual; never assume the identity by construction"
single_coherent_frame_proven = false

# --------------------------------------------------------------------------- human verification
[human_verification]
packet_document = "docs/data/DLH_WL_P3C_HUMAN_SOURCE_VERIFICATION_PACKET_2026_09_19.md"
items = ["H1", "H2", "H3", "H4", "H5", "H6", "H7"]
all_items_unresolved_at_this_issue = true
self_promotion_allowed = false
e3_promotion_authority = "human_owner_act_only"
builder_may_prepare_packet = true
builder_may_promote = false
unresolved_item_action = "source_family_blocked_for_that_wave"
real_bridge_may_proceed_with_unresolved_items = false

# --------------------------------------------------------------------------- forbidden actions
[forbidden]
real_transition_matrix_bridge_execution = false
data_download_scrape_purchase_ingestion = false
empirical_adapter_creation = false
fit_training_estimation = false
hjb_kfe_ge_matlab_household = false
full_suite = false
source_code_tests_current_governance_or_p3b_edits = false
pr_merge_close_successor_or_self_acceptance = false
tolerance_relaxation_after_outcome = false
outcome_driven_route_or_start_selection = false
Tk_positive_on_annual_forbidden_pair_as_global_block_failure = false
retained_negative_entry_used_as_probability_matrix = false
uniform_W_fabricated_for_degenerate_origin = false
