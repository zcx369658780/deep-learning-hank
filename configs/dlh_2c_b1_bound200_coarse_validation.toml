# DLH-2C-B1 variant C200 (coarse spacing) — VALIDATION_FIXTURE_NOT_CALIBRATION
#
# Numerical validation fixture ONLY; never empirical calibration.
# 317 asset-grid points on [0,200]; spacing 200/316 = 50/79, exactly matching
# accepted C50/C100/C150. All economic parameters identical to the accepted
# DLH-2B fixture. a_max is NOT enlarged beyond 200 in this Issue.

[fixture]
frequency = "annual"
asset_grid_count = 317
a_min = 0.0
a_max = 200.0
idiosyncratic_states = [0.5, 1.5]
q_low_to_high = 0.25
q_high_to_low = 0.25
rho_hh = 0.01
gamma = 2.0
tau_l = 0.15

[root]
A = 1.0
alpha_k = 0.30
delta = 0.02
G = 0.0
capital_bracket = [0.5, 45.0]
scan_bounds = [0.1, 49.0]
scan_points = 98

[numerical]
hjb_tolerance = 1e-7
hjb_max_iterations = 2000
hjb_pseudo_time_step = 1000.0
consumption_floor = 1e-10
kfe_stationarity_tolerance = 1e-8
kfe_mass_tolerance = 1e-10
negative_mass_threshold = -1e-12
generator_row_sum_tolerance = 1e-12
generator_min_off_diagonal_tolerance = -1e-14
outer_capital_tolerance = 1e-7
outer_max_iterations = 200
reproducibility_tolerance = 1e-12
