# DLH-4D minimal single-region two-asset GE steady-state validation fixture —
# VALIDATION_FIXTURE_NOT_CALIBRATION
# TWO_ASSET_SINGLE_REGION_GE_STEADY_STATE_FIXTURE
#
# Issue #20 frozen fixture (per Issue #19 DLH-4C Option A contract, accepted
# commit 7fcfd64).  The accepted two-asset household oracle
# (src/deep_learning_hank/two_asset/matlab_faithful_two_asset_ha.py,
# blob 57e32076f0e11c9a047e1f90f8c2446d4148e457, SHA-256
# 276D2244B389D6EDE140DAF8B1F9B0BE1F4AA859368941CED1A12BA8A5831AB8)
# is IMMUTABLE and read-only.  This fixture is not empirical calibration and
# must never be described as China/province evidence.

[household_grid]
b_min = -2.0
b_max = 5.0
b_points = 20
a_min = 0.0
a_max = 10.0
a_points = 20
z_states = [0.8, 1.3]
switch_matrix = [[-0.3333333333333333, 0.3333333333333333],
                 [0.3333333333333333, -0.3333333333333333]]

[household_params]
rho = 0.02
gamma_c = 2.0
phi = 5.0
chi_0 = 0.1
chi_1 = 2.0
a_bar = 0.000001
mu_z = 0.0
sigma_z = 0.0

[household_numerics]
delta = 1000.0
convergence_tolerance = 1e-7
max_iterations = 1000
drift_tolerance = 1e-12

[firm_fiscal]
Z = 1.0
alpha = 0.36
delta_capital = 0.025
B_gov = 1.0
G = 0.0
tau = 0.15
rb_gap = 0.01

[ge_domains]
r_a_low = 0.0
r_a_high = 0.12
r_b_low = -0.05
r_b_high = 0.10
L_low = 0.2
L_high = 3.0
bracket_scan_points = 9

[ge_numerics]
root_xtol = 1e-10
root_rtol = 1e-10
root_max_iterations = 100
normalized_root_tolerance = 1e-8
raw_market_residual_tolerance = 1e-6
resource_faithful_tolerance = 1e-6
fiscal_tolerance = 1e-10
wealth_flow_tolerance = 1e-6
kfe_mass_tolerance = 1e-10
kfe_min_mass_threshold = -1e-12
reproducibility_tolerance = 1e-12

[gates]
immutable_oracle_sha256 = "276D2244B389D6EDE140DAF8B1F9B0BE1F4AA859368941CED1A12BA8A5831AB8"
immutable_oracle_blob = "57e32076f0e11c9a047e1f90f8c2446d4148e457"
