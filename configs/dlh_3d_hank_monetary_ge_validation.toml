# DLH-3D full minimal single-region NK GE closure validation fixture —
# VALIDATION_FIXTURE_NOT_CALIBRATION
# D2_MACHINE_DIAGNOSTIC__MINIMAL_SINGLE_REGION_HANK_DYNAMIC_VALIDATION_FIXTURE
#
# Issue #13 frozen fixture. The monetary innovation epsilon_i(t) is a small
# deterministic validation-fixture innovation, not an empirically identified
# policy shock and not Results evidence.  No time-step refinement claim.
# Once the first numerical execution begins, these equations, fixture values,
# innovation amplitudes, horizons, dt, root method and scientific thresholds
# must not be altered within Issue #13.

[baseline]
# Accepted predecessor baselines (read-only provenance; identities verified at load).
dlh_3b_config = "configs/dlh_3b_hank_steady_state_validation.toml"
dlh_3b_config_sha256 = "82AB4A02F9D08FBBAED1349BC027FACE5361B1AB24C710C4CEA6958481CD5FC1"
