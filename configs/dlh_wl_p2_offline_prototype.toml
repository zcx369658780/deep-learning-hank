[regime_s0]
id = "S0_PARAMETRIC_CONTROL"
description = "gravity/logit linear score, correctly specified for the parametric baseline"
score_form = "sigma * (beta_d*gdp_t_j - beta_o*gdp_t_i - gamma_dist*dist_ij)"
sigma = 1.0
beta_d = 0.30
beta_o = 0.20
gamma_dist = 0.60
beta_sq = 0.0
beta_relu = 0.0
noise_sigma = 0.0
deterministic = true
