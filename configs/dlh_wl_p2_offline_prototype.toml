reference_shares_r04_t1 = [0.098255616, 0.190104212, 0.711640172]
reference_shares_r04_allowed_destinations = [0, 1, 3]
reference_share_sums = 1.000000000000
conditional_shares_time_invariant = true
conditional_shares_invariance_reason = "UNIFORM_GDP_CENTRE_SHIFT_ACROSS_REGIONS"

[regime_s1]
id = "S1_BOUNDED_NONLINEAR"
description = "same linear core plus two pre-registered nonlinear interactions"
sigma = 1.0
beta_d = 0.30
beta_o = 0.20
gamma_dist = 0.60
beta_sq = 0.05
beta_relu = 0.15
d_star = 1.0
interaction_definition = "(dist_ij / d_mean_i) * (gdp_t_j - mean_k gdp_t_k)"
x2_definition = "zscore(log1p(dist_ij))^2 over ordered i!=j pairs"
x3_definition = "max(0, dist_ij - d_star) * log(gdp_t_j)"
d_mean_i = 2.5
noise_sigma = 0.0
deterministic = true
reference_shares_r00_t1 = [0.411547386, 0.240956772, 0.168652417, 0.178843425]
reference_shares_r04_t1 = [0.049978191, 0.172580247, 0.777441563]
reference_shares_r04_allowed_destinations = [0, 1, 3]
reference_share_sums = 1.000000000000
conditional_shares_time_invariant = true
conditional_shares_invariance_reason = "UNIFORM_GDP_CENTRE_SHIFT_ACROSS_REGIONS"

