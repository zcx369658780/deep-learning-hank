# DLH-5B (Issue #25) — frozen two-region symmetric anchor validation fixture.
#
# This config is the single frozen source for the deterministic two-region
# hand-specified-flow outer fixed-point experiment. It mirrors the accepted
# household VALIDATION_FIXTURE_NOT_CALIBRATION from tests/test_dlh_4b_transfer.py
# and the DLH-5A structural contract (docs/specifications/DLH_5A_...2026_08_31.md).
#
# Z* and delta* are NOT stored here: they are derived ONCE from the frozen
# anchor household solve (Section 6 of Issue #25), pass the sanity gate, and are
# then frozen for both regions and all DLH-5B cases. This config is not to be
# edited to seek PASS.

[household]
rho = 0.02
gamma_c = 2.0
phi = 5.0
chi_0 = 0.1
chi_1 = 2.0
a_bar = 1e-6
mu_z = 0.0
sigma_z = 0.0
b_lo = -2.0
b_hi = 5.0
b_pts = 20
a_lo = 0.0
a_hi = 10.0
a_pts = 20
z = [0.8, 1.3]
switch_matrix = [[-0.3333333333333333, 0.3333333333333333], [0.3333333333333333, -0.3333333333333333]]
r_b = 0.015
tau = [0.15, 0.15]
transfer_income = [0.0, 0.0]
rb_gap = [0.01, 0.01]
delta = 1000.0
convergence_tolerance = 1e-7
max_iterations = 1000
drift_tolerance = 1e-12

[network]
M = [1.0, 1.0]
m_L = [0.10, 0.10]
P_L = [[0.90, 0.10], [0.10, 0.90]]   # derived from m_1=m_2=0.10, W_12=W_21=1
W_12 = 1.0
W_21 = 1.0

[anchor]
w_star = [1.0, 1.0]
r_a_star = [0.03, 0.03]
alpha = [0.3333333333333333, 0.3333333333333333]

[outer]
lambda = 0.50
tol_w = 1e-6
tol_ra = 1e-6
max_iter = 25
s0_tol_w = 1e-10
s0_tol_ra = 1e-10
order_invariance_tol = 1e-12
reproducibility_tol = 1e-12
accounting_tol = 1e-12
kfe_mass_tol = 1e-10
kfe_min_mass_threshold = -1e-10
boundary_mass_warning_threshold = 0.10

[output]
root = "reports/dlh_5b_two_region_fixed_point_r1_2026_08_31"
